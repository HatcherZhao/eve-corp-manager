# Local development only. Load after dev: SPRING_PROFILES_ACTIVE=dev,local.
application:
  url: http://localhost:5173
server:
  address: 127.0.0.1
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:eve_corp_manager}?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
continew-starter:
  tenant:
    enabled: false
  web:
    cors:
      allowed-origins: http://localhost:5173
  log:
    includes:
      - DESCRIPTION
      - MODULE
      - IP_ADDRESS
    access-log:
      enabled: false
justauth:
  enabled: false
snail-job:
  enabled: false
logging:
  level:
    top.continew.admin: INFO
    top.continew.starter: INFO
