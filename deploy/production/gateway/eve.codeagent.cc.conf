server {
    listen 9443 ssl http2;
    server_name eve.codeagent.cc;

    ssl_certificate /etc/nginx/ssl/codeagent.cc/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/codeagent.cc/cert.key;

    client_max_body_size 20m;

    location / {
        proxy_pass http://10.10.0.62:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 9443;
        proxy_read_timeout 3600s;
    }
}
