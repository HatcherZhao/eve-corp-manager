name: Package Docker images

on:
  workflow_dispatch:
    inputs:
      version:
        description: 与仓库 VERSION 完全一致的开发阶段版本，例如 0.1.0
        required: true
        type: string
      publish_release:
        description: 创建 GitHub Release 并上传镜像包
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  package:
    name: Package linux/amd64 images
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: 检出发版源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: 设置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 校验版本一致性
        shell: bash
        run: |
          set -euo pipefail
          repository_version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "${repository_version}" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION 必须为开发阶段格式 0.次版本.修订号。" >&2
            exit 1
          fi
          test "${repository_version}" = "${RELEASE_VERSION}"
          grep -Fq "<revision>${RELEASE_VERSION}</revision>" backend/pom.xml
          test "$(node -p "require('./frontend/package.json').version")" = "${RELEASE_VERSION}"

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建后端 fat JAR
        working-directory: backend
        run: mvn -B -ntp -Pfat_jar -pl continew-server -am -Dspotless.apply.skip=true package

      - name: 构建前端
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 linux/amd64 镜像包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/docker
          docker buildx build --platform linux/amd64 --provenance=false --load -f deploy/production/Dockerfile.api -t "eve-corp-manager-api:${RELEASE_VERSION}" .
          docker buildx build --platform linux/amd64 --provenance=false --load -f deploy/production/Dockerfile.web -t "eve-corp-manager-web:${RELEASE_VERSION}" .
          docker save "eve-corp-manager-api:${RELEASE_VERSION}" "eve-corp-manager-web:${RELEASE_VERSION}" | gzip -c > "output/docker/eve-corp-manager-${RELEASE_VERSION}.tar.gz"
          (
            cd output/docker
            sha256sum "eve-corp-manager-${RELEASE_VERSION}.tar.gz" > "eve-corp-manager-${RELEASE_VERSION}.tar.gz.sha256"
            printf 'version=%s\ncommit=%s\nbuilt_at=%s\n' "${RELEASE_VERSION}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "eve-corp-manager-${RELEASE_VERSION}.build-info.txt"
          )

      - name: 上传临时镜像包
        uses: actions/upload-artifact@v4
        with:
          name: eve-corp-manager-${{ inputs.version }}-linux-amd64
          path: output/docker/
          if-no-files-found: error
          retention-days: 30

      - name: 创建 GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "v${RELEASE_VERSION}" output/docker/* --target "${GITHUB_SHA}" --title "v${RELEASE_VERSION}" --generate-notes
