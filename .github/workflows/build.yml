name: Build skeleton
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    name: Verify project version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "${version}" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          grep -Fq "<revision>${version}</revision>" backend/pom.xml
          test "$(node -p "require('./frontend/package.json').version")" = "${version}"

  backend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Package backend
        working-directory: backend
        run: mvn -B -ntp -Pfat_jar -pl continew-server -am -Dspotless.skip=true package
  frontend:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        working-directory: frontend
        run: pnpm build
